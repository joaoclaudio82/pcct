[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-photon"
version = "0.2.0"
description = "Quantitative spectral imaging research framework for photon-counting CT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0,<3",
    "scipy>=1.14,<2",
    "matplotlib>=3.9,<4",
    "scikit-image>=0.24,<1",
    "SimpleITK>=2.4,<3",
    "nibabel>=5.3,<6",
    "pydicom>=3.0,<4",
]

[project.optional-dependencies]
app = [
    "streamlit>=1.38,<2",
]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.8,<1",
]

[tool.setuptools]
package-dir = {"" = "mvp"}

[tool.setuptools.packages.find]
where = ["mvp"]
include = ["ai_photon_mvp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["ai_photon_mvp"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["mvp/results"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
