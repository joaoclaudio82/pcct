name: Scientific benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "mvp/ai_photon_mvp/spectral.py"
      - "mvp/ai_photon_mvp/benchmark.py"
      - ".github/workflows/benchmark.yml"
      - "benchmarks/**"
      - "tests/regression/**"
  push:
    branches: [main]
    paths:
      - "mvp/ai_photon_mvp/spectral.py"
      - "mvp/ai_photon_mvp/benchmark.py"
      - ".github/workflows/benchmark.yml"
      - "benchmarks/**"
      - "tests/regression/**"

permissions:
  contents: read

jobs:
  spectral-regression:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Set up Python
        run: uv python install 3.12

      - name: Install project
        run: uv sync --extra dev --python 3.12

      - name: Run deterministic benchmark
        run: uv run python -m ai_photon_mvp.benchmark | tee benchmark-output.json

      - name: Enforce reference tolerances
        run: uv run python -m pytest tests/regression/test_spectral_benchmark.py -q

      - name: Upload benchmark output
        uses: actions/upload-artifact@v4
        with:
          name: spectral-benchmark
          path: benchmark-output.json
